<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Responsive Flowers Main</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar w-full flex items-center justify-between">
      <img src="assets/logo.png" alt="Logo" class="w-32 md:w-40" />

      <ul class="hidden md:flex space-x-10 items-center mt-5">
        <li class="font-bold"><a href="">Home</a></li>
        <li><a href="">Shop</a></li>
        <li><a href="">About us</a></li>
        <li class="flex items-center space-x-1">
          <img src="assets/shopping-cart.png" alt="" class="w-5" />
          <span>Cart ($56)</span>
        </li>
      </ul>

      <div class="flex md:hidden items-center space-x-1 mt-6">
        <img src="assets/shopping-cart.png" alt="Cart" class="w-6" />
        <span class="text-base">Cart ($56)</span>
      </div>
    </nav>

    <section class="banner mt-[60px] sm:mt-[120px]">
      <div
        class="flex flex-col-reverse md:flex-row items-end md:justify-between gap-8"
      >
        <div class="text-left md:w-1/2">
          <h1 class="text-4xl md:text-5xl font-bold leading-tight">
            ALWAYS <span class="text-[#E95A08]">FRESH</span><br />
            <span class="text-[#E95A08]">FLOWERS</span>
          </h1>
          <p class="mt-4 text-gray-600">
            Indulge your senses with the beauty and fragrance of our fresh
            flower shop. From classic roses to exotic blooms, we offer a wide
            variety of fresh flowers that are perfect for any occasion.
          </p>
        </div>

        <div class="md:w-1/2">
          <img
            src="assets/hero-flower.png"
            alt="Fresh Flowers"
            class="w-full object-cover"
          />
        </div>
      </div>
    </section>


  </body>
</html>
